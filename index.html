<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avvento a Bologna - D&D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Schermata di Accesso / Creazione -->
    <div id="schermata-login" class="container">
        <h1>L'Ombra sui Portici</h1>
        <p>Inserisci il tuo Nome in Codice. Se non esiste, verrai registrato come nuovo avventuriero.</p>
        
        <input type="text" id="codice-accesso" placeholder="Es. GuerrieroDelNettuno">
        
        <!-- Scelta della Classe (visibile sempre per semplicità nel test) -->
        <select id="scelta-classe">
            <option value="Guerriero">Guerriero (5 HP)</option>
            <option value="Mago">Mago (Pergamena della Chiarezza)</option>
            <option value="Ladro">Ladro (Grimardello Meccanico)</option>
        </select>

        <button id="btn-login">Entra / Crea Personaggio</button>
        <p id="messaggio-errore" style="color: red; display: none;"></p>
        <p id="messaggio-successo" style="color: green; display: none;"></p>
    </div>

    <!-- Schermata di Gioco Principale -->
    <div id="schermata-gioco" class="container" style="display: none;">
        <header id="barra-stato">
            <span id="nome-personaggio">Nome: ---</span>
            <span id="hp-personaggio">HP: ---</span>
            <span id="oro-personaggio">Oro: ---</span>
        </header>
        <main id="area-storia">
            <h2>Giorno 1 Completato</h2>
            <p>Benvenuto nell'avventura. Il tuo personaggio è stato creato con successo!</p>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
