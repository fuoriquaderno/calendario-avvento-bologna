<!DOCTYPE html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title | escape }}</title>
<link rel="icon" type="image/png" href="{{ '/images/favicon1.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/immagini-schermate.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/dadi.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/finestre.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/gioco.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/giornate.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/biblioteca.css' | relative_url }}">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="{{ '/js/ui/pergamene.js' | relative_url }}"></script>
<script defer src="{{ '/partita.js' | relative_url }}"></script>
<script defer src="{{ '/js/gioco/borsa-base.js' | relative_url }}"></script>
<script defer src="{{ '/js/gioco/combattimento.js' | relative_url }}"></script>
<script defer src="{{ '/js/gioco/borsa.js' | relative_url }}"></script>
<script defer src="{{ '/js/gioco/perquisizione.js' | relative_url }}"></script>
<script defer src="{{ '/js/gioco/fine-giornata.js' | relative_url }}"></script>
<script defer src="{{ '/js/gioco/luoghi.js' | relative_url }}"></script>
<script defer src="{{ '/js/gioco/negozi.js' | relative_url }}"></script>
<script defer src="{{ '/immagini-schermate.js' | relative_url }}"></script>
<script defer src="{{ '/dadi.js' | relative_url }}"></script>
{% if page.gioco %}
<script defer src="{{ '/js/giornate/giorno-2.js' | relative_url }}"></script>
<script defer src="{{ '/js/giornate/iliano.js' | relative_url }}"></script>
<script defer src="{{ '/js/giornate/giorno-3.js' | relative_url }}"></script>
<script defer src="{{ '/js/biblioteca/sala-lettura.js' | relative_url }}"></script>
<script defer src="{{ '/js/biblioteca/manoscritti.js' | relative_url }}"></script>
<script defer src="{{ '/js/biblioteca/servizi.js' | relative_url }}"></script>
<script defer src="{{ '/js/giornate/giorno-4.js' | relative_url }}"></script>
<script defer src="{{ '/js/biblioteca/stanza-nascosta.js' | relative_url }}"></script>
<script defer src="{{ '/enigmi.js' | relative_url }}"></script>
<script defer src="{{ '/js/ui/transizioni.js' | relative_url }}"></script>
<script defer src="{{ '/js/giornate/giorno-1.js' | relative_url }}"></script>
{% endif %}
{% if page.calendario %}
<link rel="stylesheet" href="{{ '/css/calendario.css' | relative_url }}">
<script defer src="{{ '/js/gioco/calendario.js' | relative_url }}"></script>
{% endif %}
{% if page.gioco %}
<link rel="stylesheet" href="{{ '/css/missione-galeazzo.css' | relative_url }}">
<script defer src="{{ '/js/gioco/missione-galeazzo.js' | relative_url }}"></script>
{% endif %}
{% if page.gioco %}
<script defer src="{{ '/js/gioco/missione-guardia.js' | relative_url }}"></script>
{% endif %}
{% if page.gioco %}<script defer src="{{ '/js/giornate/giorno-5.js' | relative_url }}"></script>{% endif %}
{% if page.gioco %}<script defer src="{{ '/js/giornate/giorno-6.js' | relative_url }}"></script>{% endif %}
<script defer src="{{ '/js/avvio.js' | relative_url }}"></script>
</head>
<body>
{% include header.html %}
<main class="site-main" id="contenuto">
<div class="scroll-container">
<div class="scroll-top" aria-hidden="true"></div>
<div class="scroll-middle">
<figure id="immagine-schermata" class="immagine-schermata" hidden
  data-immagine="{% if page.immagine_schermata %}{{ page.immagine_schermata | relative_url | escape }}{% endif %}"
  data-descrizione="{{ page.descrizione_immagine | default: '' | escape }}">
  <img id="illustrazione-schermata" alt="" decoding="async">
</figure>
{{ content }}
</div>
<div class="scroll-bottom" aria-hidden="true"></div>
</div>
</main>
{% include footer.html %}
</body>
</html>
